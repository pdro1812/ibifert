services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: pdros1812/ibiferti-backend:latest
    container_name: ibiferti-api
    restart: unless-stopped
    # O nginx acessa o backend pela rede interna (backend:3000); a porta fica
    # aberta só para o próprio servidor, não para a internet.
    ports:
      - "127.0.0.1:3000:3000"
    # Segredos vêm do arquivo .env ao lado deste compose (não versionado —
    # modelo em .env.example). Sem eles o compose se recusa a subir.
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:?defina POSTGRES_USER no .env}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:?defina POSTGRES_DB no .env}
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env}
    depends_on:
      - db
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: pdros1812/ibiferti-frontend:latest
    container_name: ibiferti-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: ibiferti-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    # Opcional: expor porta se precisar acessar externamente
    # ports:
    #   - "5433:5432"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

volumes:
  pgdata_prod: